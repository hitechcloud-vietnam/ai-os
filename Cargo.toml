[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/signing",
    "crates/sandbox",
    "crates/adapter-anthropic",
    "crates/adapter-openai",
    "crates/registry",
    "crates/skills-service",
    "crates/plugin-service",
    "crates/mcp-gateway",
    "crates/ai-gateway",
    "crates/a2a-gateway",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hitechcloud-vietnam/ai-os"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Web framework
axum = { version = "0.8", features = ["json", "query", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
# Redis
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }
# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.28", features = ["trace"] }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["tonic"] }
# Crypto
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
sha2 = "0.10"
hex = "0.4"
# Auth
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Error handling
anyhow = "1"
thiserror = "2"
# Config
config = "0.15"
dotenvy = "0.15"
# Utilities
futures = "0.3"
bytes = "1"
rand = "0.8"
base64 = "0.22"
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# MCP JSON-RPC
jsonrpc-core = "18"
# SSE
async-stream = "0.3"
# CLI
clap = { version = "4", features = ["derive"] }
